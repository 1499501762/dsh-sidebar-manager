name: Feature request
description: Suggest an improvement to the sidebar or top bar manager.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not just the solution.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: How should it look / behave? Sketches and screenshots are welcome.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Which surface?
      options:
        - Left sidebar (entries, groups, footer)
        - Conversation top bar
        - Settings page
        - Agent API / skill
        - Cross-surface moves (experimental)
        - Something else
    validations:
      required: true
